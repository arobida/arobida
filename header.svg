<svg viewBox="0 0 900 320" width="900" height="320" xmlns="http://www.w3.org/2000/svg">
  <title>Andrew Robida — Product Engineer, Marine, Builder</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#141414" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="#FFF3E4"/>
  <rect width="900" height="320" fill="url(#dots)"/>

  <!-- floating shapes -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 6 -12; 0 0" dur="7s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-8 88 68; 6 88 68; -8 88 68" dur="7s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="62" y="42" width="64" height="64" fill="#141414"/>
    <rect x="56" y="36" width="64" height="64" fill="#FFD23F" stroke="#141414" stroke-width="4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 10; 0 0" dur="8s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="10 158 228; -6 158 228; 10 158 228" dur="8s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <circle cx="164" cy="234" r="28" fill="#141414"/>
    <circle cx="158" cy="228" r="28" fill="#FF5DA2" stroke="#141414" stroke-width="4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 10; 0 0" dur="9s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="10 765 80; -6 765 80; 10 765 80" dur="9s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="726" y="66" width="90" height="40" rx="20" fill="#141414"/>
    <rect x="720" y="60" width="90" height="40" rx="20" fill="#3ECF8E" stroke="#141414" stroke-width="4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 6 -12; 0 0" dur="6.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-8 814 216; 6 814 216; -8 814 216" dur="6.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="794" y="196" width="52" height="52" fill="#141414"/>
    <rect x="788" y="190" width="52" height="52" fill="#4D7CFE" stroke="#141414" stroke-width="4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 8; 0 0" dur="7.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-4 78 148; 10 78 148; -4 78 148" dur="7.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <circle cx="84" cy="154" r="18" fill="#141414"/>
    <circle cx="78" cy="148" r="18" fill="#A78BFA" stroke="#141414" stroke-width="4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 8; 0 0" dur="8.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-4 710 160; 10 710 160; -4 710 160" dur="8.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="696" y="146" width="40" height="40" fill="#141414"/>
    <rect x="690" y="140" width="40" height="40" fill="#FF8A3D" stroke="#141414" stroke-width="4"/>
  </g>

  <!-- spinning sparkles -->
  <text x="215" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#141414" text-anchor="middle" dominant-baseline="central">✦
    <animateTransform attributeName="transform" type="rotate" values="0 215 62; 360 215 62" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="855" y="182" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#141414" text-anchor="middle" dominant-baseline="central">✦
    <animateTransform attributeName="transform" type="rotate" values="0 855 182; -360 855 182" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="650" y="56" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#141414" text-anchor="middle" dominant-baseline="central">✦
    <animateTransform attributeName="transform" type="rotate" values="0 650 56; 360 650 56" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- center card -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.2 450 150; 1.2 450 150; -1.2 450 150" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="198" y="63" width="520" height="190" fill="#141414"/>
    <rect x="190" y="55" width="520" height="190" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
    <text x="450" y="92" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="3.85" fill="#141414" text-anchor="middle">// HELLO, I'M</text>
    <text x="450" y="136" font-family="'Arial Black', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#141414" text-anchor="middle">ANDREW</text>
    <text x="450" y="180" font-family="'Arial Black', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#FF5DA2" text-anchor="middle">ROBIDA</text>
    <g>
      <rect x="360" y="192" width="30" height="8" fill="#FFD23F"/>
      <rect x="390" y="192" width="30" height="8" fill="#FF5DA2"/>
      <rect x="420" y="192" width="30" height="8" fill="#4D7CFE"/>
      <rect x="450" y="192" width="30" height="8" fill="#3ECF8E"/>
      <rect x="480" y="192" width="30" height="8" fill="#A78BFA"/>
      <rect x="510" y="192" width="30" height="8" fill="#FF8A3D"/>
      <rect x="360" y="192" width="180" height="8" fill="none" stroke="#141414" stroke-width="2"/>
    </g>
    <text x="450" y="230" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2.88" fill="#141414" text-anchor="middle">PRODUCT ENGINEER · MARINE · BUILDER</text>
  </g>

  <!-- corner bolts -->
  <circle cx="18" cy="18" r="6" fill="#FFF3E4" stroke="#141414" stroke-width="3"/>
  <circle cx="882" cy="18" r="6" fill="#FFF3E4" stroke="#141414" stroke-width="3"/>
  <circle cx="18" cy="266" r="6" fill="#FFF3E4" stroke="#141414" stroke-width="3"/>
  <circle cx="882" cy="266" r="6" fill="#FFF3E4" stroke="#141414" stroke-width="3"/>

  <!-- marquee -->
  <rect x="4" y="276" width="892" height="40" fill="#141414"/>
  <g font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="3">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -1700 0" dur="24s" repeatCount="indefinite"/>
      <text x="0" y="301" textLength="1700" lengthAdjust="spacingAndGlyphs"><tspan fill="#FFD23F">FULL-STACK DEVELOPER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF5DA2">U.S. MARINE</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#4D7CFE">PRODUCT ENGINEER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#3ECF8E">AI BUILDER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#A78BFA">SERVERLESS ARCHITECT</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF8A3D">WEB PERFORMANCE NERD</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FFD23F">LOCAL-FIRST ADVOCATE</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF5DA2">PROBLEM SOLVER</tspan><tspan fill="#FFF3E4"> • </tspan></text>
      <text x="1700" y="301" textLength="1700" lengthAdjust="spacingAndGlyphs"><tspan fill="#FFD23F">FULL-STACK DEVELOPER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF5DA2">U.S. MARINE</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#4D7CFE">PRODUCT ENGINEER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#3ECF8E">AI BUILDER</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#A78BFA">SERVERLESS ARCHITECT</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF8A3D">WEB PERFORMANCE NERD</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FFD23F">LOCAL-FIRST ADVOCATE</tspan><tspan fill="#FFF3E4"> • </tspan><tspan fill="#FF5DA2">PROBLEM SOLVER</tspan><tspan fill="#FFF3E4"> • </tspan></text>
    </g>
  </g>

  <!-- frame -->
  <rect x="2" y="2" width="896" height="316" fill="none" stroke="#141414" stroke-width="4"/>
</svg>
